<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DHSH Ideenboard – Anmeldung</title>
  <style>
    :root[data-theme="light"] {
      --primary: #3672b8;
      --primary-hover: #2b5a93;
      --primary-light: #eef4fb;
      --bg-body: #f4f6f9;
      --bg-surface: #ffffff;
      --bg-header: #3672b8;
      --text-header: #ffffff;
      --text-main: #212529;
      --text-muted: #6c757d;
      --border-color: #e2e8f0;
    }

    :root[data-theme="dark"] {
      --primary: #3672b8;
      --primary-hover: #4a83c7;
      --primary-light: #1e2a3a;
      --bg-body: #12181f;
      --bg-surface: #1e2631;
      --bg-header: #18202a;
      --text-header: #f1f5f9;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --border-color: #2d3748;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: background-color 0.2s, color 0.2s, border-color 0.2s;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background-color: var(--bg-header);
      color: var(--text-header);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 55px;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-dhsh {
      font-weight: bold;
      font-size: 1.1rem;
      background-color: #ffffff;
      color: #3672b8;
      padding: 4px 10px;
      border-radius: 4px;
    }

    .theme-toggle-btn {
      background-color: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 5px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .theme-toggle-btn:hover {
      background-color: rgba(255, 255, 255, 0.25);
    }

    /* Login Box Container */
    .login-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      width: 100%;
      max-width: 380px;
      padding: 35px 30px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }

    .login-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .login-header h2 {
      font-size: 1.35rem;
      margin-bottom: 6px;
    }

    .login-header p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 0.9rem;
      background-color: var(--bg-body);
      color: var(--text-main);
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(54, 114, 184, 0.2);
    }

    .password-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .forgot-link {
      font-size: 0.75rem;
      color: var(--primary);
      text-decoration: none;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .btn-login {
      width: 100%;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      padding: 11px;
      border-radius: 4px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn-login:hover {
      background-color: var(--primary-hover);
    }

    .login-footer {
      margin-top: 22px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-container">
      <div class="logo-dhsh">DHSH</div>
      <h3 style="font-size: 0.98rem; font-weight: 500;">Ideenboard Application</h3>
    </div>
    <button class="theme-toggle-btn" id="themeToggle">
      <span id="themeIcon">🌙</span> <span id="themeLabel">Dark Mode</span>
    </button>
  </header>

  <main class="login-wrapper">
    <div class="login-card">
      
      <div class="login-header">
        <h2>Willkommen zurück</h2>
        <p>Bitte melden Sie sich an der Plattform an</p>
      </div>

      <form action="startseite.html" method="GET">
        <div class="form-group">
          <label for="username">Nutzername / E-Mail</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            placeholder="z. B. max.mustermann@dhsh.de" 
            required 
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <div class="password-row">
            <label for="password">Passwort</label>
            <a href="#" class="forgot-link">Passwort vergessen?</a>
          </div>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="btn-login">Anmelden</button>
      </form>

      <div class="login-footer">
        Duale Hochschule Schleswig-Holstein &copy; 2026
      </div>

    </div>
  </main>

  <script>
    const themeToggleBtn = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const themeLabel = document.getElementById('themeLabel');
    const htmlElement = document.documentElement;

    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = htmlElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      htmlElement.setAttribute('data-theme', newTheme);

      if (newTheme === 'dark') {
        themeIcon.textContent = '☀️';
        themeLabel.textContent = 'Light Mode';
      } else {
        themeIcon.textContent = '🌙';
        themeLabel.textContent = 'Dark Mode';
      }
    });
  </script>

</body>
</html>
