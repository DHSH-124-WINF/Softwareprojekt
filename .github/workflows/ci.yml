name: CI
on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, edited]

jobs:
  check-names:
    runs-on: ubuntu-latest
    steps:
      - name: Branch-Name prüfen
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ ! "$BRANCH" =~ ^(main|dev|(feature|bugfix|hotfix|refactor|docs)/.+)$ ]]; then
            echo "Ungültiger Branch-Name: $BRANCH"
            exit 1
          fi
      - name: PR-Titel prüfen
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$TITLE" =~ ^\[[A-Z][A-Z0-9]*-[0-9]+\]\ [a-z]+:\ .+ ]]; then
            echo "PR-Titel muss so aussehen: [PROJ-123] feat: beschreibung"
            exit 1
          fi
